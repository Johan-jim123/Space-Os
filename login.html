<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login-screen</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="Buttons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div id="login-screen"> 
      <div id="inner-login">
          <input type="text" id="username" placeholder="Austronaut ID">
          <input type="password" id="password" placeholder="password">
          <button id ="login-btn">LAUNCH</button>
          <p id ="login-error"></p>
      </div>
  </div>
  <div class="cursor1">
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C12 2 7 6 7 13C7 17 9 20 12 22C15 20 17 17 17 13C17 6 12 2 12 2Z" fill="#0077b6" stroke="#90e0ef" stroke-width="1.5"/>
      <path d="M7 14L3 17V20L7 18V14Z" fill="#023e8a"/>
      <path d="M17 14L21 17V20L17 18V14Z" fill="#023e8a"/>
      <circle cx="12" cy="10" r="2.5" fill="#011627" stroke="#90e0ef" stroke-width="1"/>
    </svg>
  </div>
  <script>
        document.addEventListener('mousemove', (e) => {
            window.parent.postMessage({ type: 'cursorMove', x: e.clientX, y: e.clientY }, '*');
        });
        
        document.addEventListener('mousedown', () => {
            window.parent.postMessage({ type: 'cursorDown' }, '*');
        });
        
        document.addEventListener('mouseup', () => {
            window.parent.postMessage({ type: 'cursorUp' }, '*');
        });
    </script>
</body>
</html>
