<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JJ-OS // SOLAR SYSTEM ORBIT PLOTTER</title>
    <style>
        /* Reset margins and set full screen background */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020b14;
            font-family: monospace;
            color: #00f0ff;
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        /* Top SYS Header Bar */
        .sys-bar {
            height: 35px;
            background: #031424;
            border-bottom: 2px solid #00f0ff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        .canvas-container {
            position: relative;
            flex: 1;
            width: 100%;
        }

        #starCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Top SYS Header Bar -->
        <div class="sys-bar">
            <span>SYS // ORBITAL_RADAR</span>
        </div>

        <!-- Canvas Container -->
        <div class="canvas-container">
            <canvas id="starCanvas"></canvas>
        </div>
    </div>
    <style>
  /* Hide the native hardware cursor inside the app */
  * { cursor: none !important; }
</style>

<script>
  // Broadcast mouse data to the parent OS window
  document.addEventListener('mousemove', (e) => {
    window.parent.postMessage({ type: 'cursorMove', x: e.clientX, y: e.clientY }, '*');
  });
  
  document.addEventListener('mousedown', () => {
    window.parent.postMessage({ type: 'cursorDown' }, '*');
  });
  
  document.addEventListener('mouseup', () => {
    window.parent.postMessage({ type: 'cursorUp' }, '*');
  });
</script>
    <script src="starchart.js"></script>
</body>
</html>
