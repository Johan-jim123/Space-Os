<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Space Notes Telemetry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="notes-container">

        <div class="sidebar">
            <button class="l-button">+ NEW_LOG</button>
            
            <div class="sidebar-header">
                <span>LOG INDEX</span>
                <span>04</span>
            </div>

            <div class="log-list">
                <div class="log-item">
                    <div class="log-title">LOG_004 // SPACE_RULES</div>
                    <div class="log-date">2026.09.06</div>
                </div>

                <div class="log-item">
                    <div class="log-title">LOG_003 // ORBIT_ENTRY</div>
                    <div class="log-date">2026.09.05</div>
                </div>

                <div class="log-item">
                    <div class="log-title">LOG_002 // THRUSTER_CAL</div>
                    <div class="log-date">2026.09.04</div>
                </div>

                <div class="log-item">
                    <div class="log-title">LOG_001 // SYS_INITIALIZE</div>
                    <div class="log-date">2026.09.03</div>
                </div>
            </div>
        </div> 

        <div class="content-area">
            <div class="th">
                <h2>[ SYS // MISSION LOGS ]</h2>
                <p>STATUS: <span class="status-ok">NOMINAL</span> // UTC: 17:20:00</p>
            </div>

            <div class="ec">
                <div class="prompt">&gt; INPUT_</div>
                <textarea class="log-input" placeholder="// Enter telemetry log data here..." spellcheck="false">[ TIME: 000:00:00:01 MET ]
[ NETWORK: JJ_OS_PRIMARY // DEEP_SPACE_OPS ]

// FLIGHT LOG 004: STANDARD OPERATING PROCEDURES & PROTOCOLS
===========================================================

RULE #1: DO NOT DIE.
  ├─ Breathing vacuum is highly unrecommended by flight medicine.
  └─ Keep suit pressure above 14.7 PSI at all times.

RULE #2: DO NOT PRESS THE RED BUTTON.
  ├─ Unless explicitly told to press the red button.
  └─ If pressed, refer immediately back to Rule #1.

RULE #3: HYDRATION & REFUELING PROTOCOLS.
  ├─ Coffee consumption is vital for orbital navigation.
  └─ Zero-G spill cleanup is the responsibility of the perpetrator.

RULE #4: ANOMALY DISCOVERY.
  ├─ If aliens are spotted, take a photo BEFORE screaming.
  └─ Do not attempt to feed space fauna.

> SYSTEM PROTOCOLS LOADED // STAY SAFE OUT THERE, ASTRONAUT</textarea>
            </div>
        </div> 
    </div> 
    <script>
  document.addEventListener('mousemove', (e) => {
    window.parent.postMessage({ type: 'cursorMove', x: e.clientX, y: e.clientY }, '*');
  });
  
  document.addEventListener('mousedown', () => {
    window.parent.postMessage({ type: 'cursorDown' }, '*');
  });
  
  document.addEventListener('mouseup', () => {
    window.parent.postMessage({ type: 'cursorUp' }, '*');
  });
</script>
    <script src="script.js"></script>
</body>
</html>
