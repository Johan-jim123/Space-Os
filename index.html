<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJ-OS</title>
  <!-- NASA Telemetry Button Styles -->
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body style="background-image: url('Main.png'); background-size: cover; background-repeat: no-repeat; background-position: center; margin: 0; height: 100vh; width: 100vw; overflow: hidden;">

  <!-- Top Bar Area -->
  <div id="top" style="position: absolute; top: 0; left: 0; width: 100%; z-index: 9999; pointer-events: none;">
    <!-- System Clock Target -->
    <div id="timeElement" style="position: absolute; top: 10px; right: 20px; pointer-events: auto;"></div>

    <!-- Open Launcher Button -->
    <span id="welcomeopen" class="nasa-btn-open" style="pointer-events: auto;">
      SYS // JJ-OS
    </span>
  </div>

  <!-- Welcome Window Module -->
  <div id="welcome" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 700px; height: 400px; border: 4mm ridge rgba(0, 112, 125, 0.9); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.95), 0 0 15px rgba(0, 112, 125, 0.8);">
    
    <!-- Window Header -->
    <div id="welcomeheader" style="height: 30px; background: rgba(8, 12, 20, 0.95); backdrop-filter: blur(5px); cursor: move; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: #d1d5db; font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; letter-spacing: 1px; border-bottom: 1px solid rgba(255, 255, 255, 0.15);">
      
      <!-- Module Title -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="color: #00e1ff; font-weight: bold;">[FLT-01]</span>
        <span style="text-transform: uppercase; color: #f3f4f6;">JJ-OS // WELCOME_MODULE</span>
      </div>

      <!-- Close Button -->
      <span id="welcomeclose" class="nasa-btn-close">
        [ABORT ✕]
      </span>

    </div>

    <!-- Embedded Module Frame -->
    <iframe src="welcome.html" style="width: 100%; height: calc(100% - 30px); border: none; display: block;"></iframe>

  </div>

  <!-- Desktop Apps Area -->
  <div id="desktopApps" style="padding-top: 60px; padding-left: 20px; display: inline-block;">

    <!-- Space Notes Icon -->
    <div id="notesOpen" class="desktop-icon" onclick="handleIconTap(event, this)">
      <img src="note.png" style="width: 54px; height: 54px; object-fit: contain;">
      <p class="app-title">Space notes</p>
    </div>

  </div>

  <!-- NEW APP WINDOW: Space Notes -->
  <div id="spaceNotesApp" style="position: absolute; top: 120px; left: 300px; display: none; width: 520px; height: 380px; border: 4mm ridge rgba(0, 112, 125, 0.9); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.95), 0 0 15px rgba(0, 112, 125, 0.8);">
    
    <!-- Window Header / Title Bar -->
    <div id="spaceNotesAppheader" style="height: 30px; background: rgba(8, 12, 20, 0.95); backdrop-filter: blur(5px); cursor: move; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: #d1d5db; font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; letter-spacing: 1px; border-bottom: 1px solid rgba(255, 255, 255, 0.15);">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="color: #00e1ff; font-weight: bold;">[APP-02]</span>
        <span style="text-transform: uppercase; color: #f3f4f6;">JJ-OS // SPACE_NOTES</span>
      </div>
      <button id="notesClose" class="nasa-btn-close">[ABORT ✕]</button>
    </div>

    <!-- App Content Box -->
    <iframe src="notes.html" style="width: 100%; height: calc(100% - 30px); border: none; display: block;"></iframe>

  </div>

  <script src="script.js"></script>

</body>
</html>
