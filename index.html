<body style="background-image: url('Main.png'); background-size: cover; background-repeat: no-repeat; background-position: center; margin: 0; min-height: 100vh;">

  <p id="timeElement"
     style="position: absolute; top: 10px; right: 20px; font-family: 'Courier New', Courier, monospace; font-size: 14px; color: #00e1ff; font-weight: bold; text-shadow: 0 0 8px rgba(0, 225, 255, 0.7); letter-spacing: 1px; margin: 0; z-index: 10;">
     Time
  </p>

  <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 700px; height: 400px; border: 4mm ridge rgba(0, 112, 125, 0.9); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.95), 0 0 15px rgba(0, 112, 125, 0.8);">
    <iframe src="welcome.html" style="width: 100%; height: 100%; border: none; display: block;"></iframe>
  </div>

  <script>
    function updateClock() {
      var timmie = new Date().toLocaleTimeString();
      var timeText = document.querySelector("#timeElement");
      if (timeText) {
        timeText.innerHTML = timmie;
      }
    }
    
    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
